name: prosift
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:

  # --- Runtime ---
  - python=3.12
  - openjdk=17                        # Required by Nextflow
  - nextflow

  # --- Core data handling (Phase 1+) ---
  - pandas>=2.0,<3
  - numpy>=1.26,<2
  - pyarrow                           # Parquet intermediates
  - pyyaml

  # --- HTTP / API (Phase 1 UniProt mapping, Phase 3 databases) ---
  # requests also drives BioMart ortholog mapping (Phase 3, Module 01 Layer 2)
  # via the Ensembl BioMart XML REST endpoint -- no additional library needed.
  - requests
  - tqdm                              # Progress bars for bulk API calls

  # --- R integration (Phase 2: DEqMS, limma) ---
  - r-base>=4.3
  - rpy2>=3.5
  - bioconductor-limma
  - bioconductor-deqms

  # --- Statistics (Phase 2+) ---
  - scipy>=1.12
  - scikit-learn                      # Imputation (KNN, iterative)

  # --- Enrichment analysis (Phase 2) ---
  - gseapy=1.1.13                     # ORA and GSEA; pinned: bin/enrichment.py validates its output structure against this version
  - bioconductor-rrvgo                # GO-term redundancy reduction (Module 05, Section 4.13)
  - bioconductor-gosemsim             # Semantic similarity backend for rrvgo
  - bioconductor-go.db                # GO term DAG + MSigDB name-to-GO-ID lookup
  - bioconductor-org.mm.eg.db         # Mouse annotation database used by rrvgo

  # --- Visualization (Phase 2 QC/EDA plots) ---
  - matplotlib
  - seaborn
  - plotly
  - python-kaleido                     # Static PNG export from Plotly figures (Module 02+)

  # --- Frontend (Phase 4, Module 08 R Shiny app in frontend/) ---
  - r-shiny                            # Application framework
  - r-dt                              # Sortable/filterable server-side tables
  - r-plotly                          # Interactive plots (term/profile views)
  - r-bslib                           # Bootstrap theming (teal accent)
  - r-rsqlite                         # SQLite driver for the Module 07 results DB
  - r-dbi                             # DB interface layer used by db.R
  - r-jsonlite                        # Parse run_parameters JSON values (databases.enabled)

  # --- Testing ---
  - pytest>=7.4
  - pytest-cov>=4.1
  - r-testthat                        # Module 08 frontend unit + testServer tests
  - r-shinytest2                      # Module 08 frontend end-to-end (headless Chrome)
  - r-chromote                        # Headless Chrome driver for shinytest2

  # --- Linting / typing (QC component) ---
  - ruff>=0.5.0
  - mypy>=1.10
  - pandas-stubs
  - types-requests
  - types-PyYAML
